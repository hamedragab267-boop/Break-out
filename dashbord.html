<!DOCTYPE html>

body{background:linear-gradient(135deg,#0f2027,#203a43,#2c5364); color:#fff; font-family:'Segoe UI',sans-serif;}

<!-- Stats -->

  </div>

  <div>

    <span id="total-wallet">0</span> EGY
  </div>

  <div>
    Total Points:
    <span id="total-points">0</span>
  </div>

<!-- Users Management -->

<tr>

<th>Phone</th>
<th>Wallet</th>
<th>Points</th>
<th>Role</th>
<th>Actions</th>
</tr>

</thead>

<tbody id="usersTable"></tbody>

</table>

</div>

<h4>Drinks Management</h4>

<button
    class="btn btn-success mb-3"
    onclick="addNewDrink()"
>
    Add New Drink
</button>

<thead>

<tr>
<th>Image</th>
<th>Name</th>
<th>Base Price</th>
<th>Flavors</th>
<th>Actions</th>
</tr>

</thead>

</table>

<script type="module">

import {
    initializeApp

from

import {
    getAuth,
    onAuthStateChanged,
    signOut

from

    getFirestore,
    collection,
    getDocs,
    doc,
    getDoc,
    updateDoc,
    setDoc,
    deleteDoc,
    increment
}
from
"https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore.js";


import {
    getStorage,
    ref,
    uploadBytes,
    getDownloadURL
}
from
"https://www.gstatic.com/firebasejs/9.23.0/firebase-storage.js";



/* =========================================
   FIREBASE
========================================= */

const firebaseConfig = {

    apiKey:
    "AIzaSyAubjKdiEqfDpW-tc94l-AI7lbPs7IU04",

    authDomain:
    "breakout-d5088.firebaseapp.com",

    projectId:
    "breakout-d5088",

    storageBucket:
    "breakout-d5088.appspot.com",

    messagingSenderId:
    "57071720148",

    appId:
    "1:57071720148:web:1a628bbb31191efcd41"

};


const app =
initializeApp(firebaseConfig);

const auth =
getAuth(app);

const db =
getFirestore(app);

const storage =
getStorage(app);



/* =========================================
   ELEMENTS
========================================= */

const usersTable =
document.getElementById("usersTable");

const drinksTable =
document.getElementById("drinksTable");

const toast =
document.getElementById("toast");

const totalUsers =
document.getElementById("total-users");

const totalWallet =
document.getElementById("total-wallet");

const totalPoints =
document.getElementById("total-points");



/* =========================================
   LOCAL DATA
   مهم:
   البيانات تفضل موجودة في الذاكرة
   بدل إعادة تحميل Firestore كل مرة
========================================= */

const usersData =
new Map();

const drinksData =
new Map();

let walletSum = 0;

let pointsSum = 0;



/* =========================================
   TOAST
========================================= */

function showToast(msg){

    toast.textContent =
    msg;

    toast.classList.add("show");

    setTimeout(
        ()=>{
            toast.classList.remove("show");
        },
        2500
    );

}



/* =========================================
   LOGOUT
========================================= */

window.logout =
async ()=>{

    try{

        await signOut(auth);

        window.location.href =
        "login.html";

    }

    catch(error){

        console.error(error);

        showToast(
            "Logout failed"
        );

    }

};



/* =========================================
   USERS MANAGEMENT
========================================= */

async function loadUsers(){

    try{

        usersTable.innerHTML =
        "";

        walletSum =
        0;

        pointsSum =
        0;

        usersData.clear();


        const snapshot =
        await getDocs(
            collection(
                db,
                "users"
            )
        );


        totalUsers.textContent =
        snapshot.size;


        /*
         * DocumentFragment أسرع من
         * innerHTML += داخل loop
         */

        const fragment =
        document.createDocumentFragment();


        snapshot.forEach(
            userDoc => {

                const d =
                userDoc.data();


                const wallet =
                Number(
                    d.wallet || 0
                );


                const points =
                Number(
                    d.points || 0
                );


                walletSum +=
                wallet;

                pointsSum +=
                points;


                usersData.set(
                    userDoc.id,
                    {
                        email:
                        d.email || "",

                        phone:
                        d.phone || "",

                        wallet:
                        wallet,

                        points:
                        points,

                        role:
                        d.role || "user"
                    }
                );


                const tr =
                document.createElement("tr");


                tr.dataset.userId =
                userDoc.id;


                tr.innerHTML = `

                    <td>
                        ${d.email || ""}
                    </td>

                    <td>

                        <input
                            value="${d.phone || ''}"
                            onchange="
                                updateUserField(
                                    '${userDoc.id}',
                                    'phone',
                                    this.value
                                )
                            "
                        >

                    </td>

                    <td data-wallet>
                        ${wallet}
                    </td>

                    <td data-points>
                        ${points}
                    </td>

                    <td>

                        <input
                            value="${d.role || 'user'}"
                            onchange="
                                updateUserField(
                                    '${userDoc.id}',
                                    'role',
                                    this.value
                                )
                            "
                        >

                    </td>

                    <td>

                        <button
                            class="btn btn-sm btn-success"
                            onclick="
                                rechargeWallet(
                                    '${userDoc.id}'
                                )
                            "
                        >
                            Recharge
                        </button>


                        <button
                            class="btn btn-sm btn-danger"
                            onclick="
                                deleteUser(
                                    '${userDoc.id}'
                                )
                            "
                        >
                            Delete
                        </button>

                    </td>

                `;


                fragment.appendChild(
                    tr
                );

            }
        );


        usersTable.appendChild(
            fragment
        );


        totalWallet.textContent =
        walletSum;

        totalPoints.textContent =
        pointsSum;

    }

    catch(error){

        console.error(
            "loadUsers:",
            error
        );

        showToast(
            "Failed to load users"
        );

    }

}



/* =========================================
   UPDATE USER
   لا يوجد loadUsers()
========================================= */

window.updateUserField =
async (
    id,
    field,
    value
)=>{

    try{

        await updateDoc(
            doc(
                db,
                "users",
                id
            ),
            {
                [field]:
                value
            }
        );


        /*
         * تحديث البيانات المحلية فقط
         */

        if(
            usersData.has(id)
        ){

            usersData.get(id)[field] =
            value;

        }


        showToast(
            "User updated!"
        );

    }

    catch(error){

        console.error(
            error
        );

        showToast(
            "Update failed"
        );

    }

};



/* =========================================
   RECHARGE WALLET
   لا يوجد loadUsers()
========================================= */

window.rechargeWallet =
async (
    id
)=>{

    const amount =
    parseInt(
        prompt(
            "Enter amount to add:"
        )
    );


    if(
        isNaN(amount)
    ){

        showToast(
            "Invalid number"
        );

        return;

    }


    if(
        amount <= 0
    ){

        showToast(
            "Amount must be greater than 0"
        );

        return;

    }


    try{

        await updateDoc(
            doc(
                db,
                "users",
                id
            ),
            {
                wallet:
                increment(amount)
            }
        );


        /*
         * تحديث القيمة المحلية
         */

        const user =
        usersData.get(id);


        if(user){

            user.wallet =
            Number(
                user.wallet || 0
            ) + amount;

        }


        walletSum +=
        amount;


        /*
         * تحديث الصف فقط
         */

        const row =
        document.querySelector(
            `tr[data-user-id="${id}"]`
        );


        if(row){

            const walletCell =
            row.querySelector(
                "[data-wallet]"
            );


            if(walletCell){

                walletCell.textContent =
                user.wallet;

            }

        }


        totalWallet.textContent =
        walletSum;


        showToast(
            "Wallet updated!"
        );

    }

    catch(error){

        console.error(
            error
        );

        showToast(
            "Wallet update failed"
        );

    }

};



/* =========================================
   DELETE USER
   لا يوجد loadUsers()
========================================= */

window.deleteUser =
async (
    id
)=>{

    if(
        !confirm(
            "Delete this user?"
        )
    ){

        return;

    }


    try{

        const user =
        usersData.get(id);


        await deleteDoc(
            doc(
                db,
                "users",
                id
            )
        );


        /*
         * تعديل الإحصائيات
         */

        if(user){

            walletSum -=
            Number(
                user.wallet || 0
            );

            pointsSum -=
            Number(
                user.points || 0
            );

        }


        usersData.delete(
            id
        );


        /*
         * حذف الصف فقط
         */

        const row =
        document.querySelector(
            `tr[data-user-id="${id}"]`
        );


        if(row){

            row.remove();

        }


        totalUsers.textContent =
        usersData.size;

        totalWallet.textContent =
        walletSum;

        totalPoints.textContent =
        pointsSum;


        showToast(
            "User deleted!"
        );

    }

    catch(error){

        console.error(
            error
        );

        showToast(
            "Delete failed"
        );

    }

};



/* =========================================
   DRINKS MANAGEMENT
========================================= */

async function loadDrinks(){

    try{

        drinksTable.innerHTML =
        "";

        drinksData.clear();


        const snapshot =
        await getDocs(
            collection(
                db,
                "drinks"
            )
        );


        const fragment =
        document.createDocumentFragment();


        snapshot.forEach(
            drinkDoc => {

                const data =
                drinkDoc.data();


                const drink = {

                    id:
                    drinkDoc.id,

                    name:
                    data.name || "",

                    basePrice:
                    Number(
                        data.basePrice || 0
                    ),

                    flavors:
                    Array.isArray(
                        data.flavors
                    )
                    ?
                    data.flavors
                    :
                    [],

                    image:
                    data.image || ""

                };


                drinksData.set(
                    drink.id,
                    drink
                );


                fragment.appendChild(
                    createDrinkRow(
                        drink
                    )
                );

            }
        );


        drinksTable.appendChild(
            fragment
        );

    }

    catch(error){

        console.error(
            "loadDrinks:",
            error
        );

        showToast(
            "Failed to load drinks"
        );

    }

}



/* =========================================
   CREATE DRINK ROW
========================================= */

function createDrinkRow(
    drink
){

    const tr =
    document.createElement("tr");


    tr.dataset.drinkId =
    drink.id;


    const flavorsHtml =
    drink.flavors
    .map(
        (f,i)=>`

            <div
                style="
                    display:flex;
                    gap:5px;
                    margin-bottom:2px;
                "
            >

                <input
                    value="${f.name || ''}"
                    placeholder="Flavor"
                    onchange="
                        updateFlavor(
                            '${drink.id}',
                            ${i},
                            'name',
                            this.value
                        )
                    "
                >

                <input
                    type="number"
                    value="${f.price || 0}"
                    placeholder="Price"
                    onchange="
                        updateFlavor(
                            '${drink.id}',
                            ${i},
                            'price',
                            this.value
                        )
                    "
                >

            </div>

        `
    )
    .join("");


    tr.innerHTML = `

        <td>

            <img
                src="${drink.image || ''}"
                class="drink-img"
                onclick="
                    changeImage(
                        '${drink.id}'
                    )
                "
                title="Click to change image"
            >

        </td>


        <td>

            <input
                value="${drink.name}"
                onchange="
                    updateField(
                        '${drink.id}',
                        'name',
                        this.value
                    )
                "
            >

        </td>


        <td>

            <input
                type="number"
                value="${drink.basePrice}"
                onchange="
                    updateField(
                        '${drink.id}',
                        'basePrice',
                        this.value
                    )
                "
            >

        </td>


        <td>

            ${flavorsHtml}

            <button
                class="btn btn-sm btn-success"
                onclick="
                    addFlavor(
                        '${drink.id}'
                    )
                "
            >
                Add Flavor
            </button>

        </td>


        <td>

            <button
                class="btn btn-sm btn-danger"
                onclick="
                    deleteDrink(
                        '${drink.id}'
                    )
                "
            >
                Delete
            </button>

        </td>

    `;


    return tr;

}



/* =========================================
   UPDATE DRINK FIELD
   لا يوجد loadDrinks()
========================================= */

window.updateField =
async (
    id,
    field,
    value
)=>{

    try{

        if(
            field === "basePrice"
        ){

            value =
            parseInt(value);

        }


        await updateDoc(
            doc(
                db,
                "drinks",
                id
            ),
            {
                [field]:
                value
            }
        );


        /*
         * تحديث البيانات المحلية
         */

        const drink =
        drinksData.get(id);


        if(drink){

            drink[field] =
            value;

        }


        showToast(
            "Updated!"
        );

    }

    catch(error){

        console.error(
            error
        );

        showToast(
            "Update failed"
        );

    }

};



/* =========================================
   UPDATE FLAVOR
   لا يوجد loadDrinks()
========================================= */

window.updateFlavor =
async (
    id,
    index,
    field,
    value
)=>{

    try{

        const drink =
        drinksData.get(id);


        if(!drink){

            showToast(
                "Drink not found"
            );

            return;

        }


        const flavors =
        drink.flavors;


        if(
            !flavors[index]
        ){

            showToast(
                "Flavor not found"
            );

            return;

        }


        if(
            field === "price"
        ){

            value =
            parseInt(value);

        }


        /*
         * نعمل نسخة جديدة
         */

        const newFlavors =
        flavors.map(
            (flavor,i)=>{

                if(i === index){

                    return {
                        ...flavor,
                        [field]:
                        value
                    };

                }

                return flavor;

            }
        );


        await updateDoc(
            doc(
                db,
                "drinks",
                id
            ),
            {
                flavors:
                newFlavors
            }
        );


        drink.flavors =
        newFlavors;


        showToast(
            "Flavor updated!"
        );

    }

    catch(error){

        console.error(
            error
        );

        showToast(
            "Flavor update failed"
        );

    }

};



/* =========================================
   ADD FLAVOR
   لا يوجد loadDrinks()
========================================= */

window.addFlavor =
async (
    id
)=>{

    const name =
    prompt(
        "Flavor name:"
    );


    const price =
    parseInt(
        prompt(
            "Flavor price:"
        )
    );


    if(
        !name ||
        isNaN(price)
    ){

        showToast(
            "Invalid input"
        );

        return;

    }


    try{

        const drink =
        drinksData.get(id);


        if(!drink){

            showToast(
                "Drink not found"
            );

            return;

        }


        const flavors =
        [
            ...drink.flavors,
            {
                name:
                name,

                price:
                price
            }
        ];


        await updateDoc(
            doc(
                db,
                "drinks",
                id
            ),
            {
                flavors:
                flavors
            }
        );


        drink.flavors =
        flavors;


        /*
         * نحدث صف المشروب فقط
         */

        const oldRow =
        document.querySelector(
            `tr[data-drink-id="${id}"]`
        );


        if(oldRow){

            const newRow =
            createDrinkRow(
                drink
            );


            oldRow.replaceWith(
                newRow
            );

        }


        showToast(
            "Flavor added!"
        );

    }

    catch(error){

        console.error(
            error
        );

        showToast(
            "Failed to add flavor"
        );

    }

};



/* =========================================
   CHANGE IMAGE
   لا يوجد loadDrinks()
========================================= */

window.changeImage =
async (
    id
)=>{

    const fileInput =
    document.createElement(
        "input"
    );


    fileInput.type =
    "file";

    fileInput.accept =
    "image/*";

    fileInput.click();


    fileInput.onchange =
    async ()=>{

        const file =
        fileInput.files[0];


        if(!file){

            return;

        }


        try{

            /*
             * اسم فريد للصورة
             */

            const uniqueName =
            Date.now() +
            "_" +
            file.name;


            const storageRef =
            ref(
                storage,
                "drinks/" +
                uniqueName
            );


            await uploadBytes(
                storageRef,
                file
            );


            const imageUrl =
            await getDownloadURL(
                storageRef
            );


            await updateDoc(
                doc(
                    db,
                    "drinks",
                    id
                ),
                {
                    image:
                    imageUrl
                }
            );


            /*
             * تحديث البيانات المحلية
             */

            const drink =
            drinksData.get(id);


            if(drink){

                drink.image =
                imageUrl;

            }


            /*
             * تغيير الصورة فقط
             */

            const row =
            document.querySelector(
                `tr[data-drink-id="${id}"]`
            );


            if(row){

                const image =
                row.querySelector(
                    "img.drink-img"
                );


                if(image){

                    image.src =
                    imageUrl;

                }

            }


            showToast(
                "Image updated!"
            );

        }

        catch(error){

            console.error(
                error
            );

            showToast(
                "Image update failed"
            );

        }

    }

};



/* =========================================
   ADD NEW DRINK
========================================= */

window.addNewDrink =
async ()=>{

    const name =
    prompt(
        "Drink name:"
    );


    const basePrice =
    parseInt(
        prompt(
            "Base price:"
        )
    );


    if(
        !name ||
        isNaN(basePrice)
    ){

        showToast(
            "Invalid input"
        );

        return;

    }


    const flavorCount =
    parseInt(
        prompt(
            "How many flavors?"
        )
    );


    const flavors = [];


    for(
        let i=0;
        i<flavorCount;
        i++
    ){

        const fname =
        prompt(
            `Flavor ${i+1} name:`
        );


        const fprice =
        parseInt(
            prompt(
                `Flavor ${i+1} price:`
            )
        );


        if(
            fname &&
            !isNaN(fprice)
        ){

            flavors.push({

                name:
                fname,

                price:
                fprice

            });

        }

    }


    const fileInput =
    document.createElement(
        "input"
    );


    fileInput.type =
    "file";

    fileInput.accept =
    "image/*";

    fileInput.click();


    fileInput.onchange =
    async ()=>{

        const file =
        fileInput.files[0];


        if(!file){

            return;

        }


        try{

            const uniqueName =
            Date.now() +
            "_" +
            file.name;


            const storageRef =
            ref(
                storage,
                "drinks/" +
                uniqueName
            );


            await uploadBytes(
                storageRef,
                file
            );


            const imageUrl =
            await getDownloadURL(
                storageRef
            );


            const drinkRef =
            doc(
                collection(
                    db,
                    "drinks"
                )
            );


            await setDoc(
                drinkRef,
                {
                    name:
                    name,

                    basePrice:
                    basePrice,

                    flavors:
                    flavors,

                    image:
                    imageUrl
                }
            );


            /*
             * إضافة المشروب للذاكرة
             */

            const drink = {

                id:
                drinkRef.id,

                name:
                name,

                basePrice:
                basePrice,

                flavors:
                flavors,

                image:
                imageUrl

            };


            drinksData.set(
                drinkRef.id,
                drink
            );


            /*
             * إضافة الصف فقط
             */

            drinksTable.appendChild(
                createDrinkRow(
                    drink
                )
            );


            showToast(
                "Drink added!"
            );

        }

        catch(error){

            console.error(
                error
            );

            showToast(
                "Failed to add drink"
            );

        }

    }

};



/* =========================================
   DELETE DRINK
   لا يوجد loadDrinks()
========================================= */

window.deleteDrink =
async (
    id
)=>{

    if(
        !confirm(
            "Delete this drink?"
        )
    ){

        return;

    }


    try{

        await deleteDoc(
            doc(
                db,
                "drinks",
                id
            )
        );


        drinksData.delete(
            id
        );


        /*
         * حذف الصف فقط
         */

        const row =
        document.querySelector(
            `tr[data-drink-id="${id}"]`
        );


        if(row){

            row.remove();

        }


        showToast(
            "Drink deleted!"
        );

    }

    catch(error){

        console.error(
            error
        );

        showToast(
            "Delete failed"
        );

    }

};



/* =========================================
   AUTH GUARD
========================================= */

onAuthStateChanged(
    auth,
    async user => {

        if(!user){

            window.location.href =
            "login.html";

            return;

        }


        try{

            const snap =
            await getDoc(
                doc(
                    db,
                    "users",
                    user.uid
                )
            );


            if(
                !snap.exists() ||
                snap.data().role !== "admin"
            ){

                alert(
                    "Access Denied"
                );


                await signOut(auth);


                return;

            }


            /*
             * أول تحميل فقط
             */

            await Promise.all([
                loadUsers(),
                loadDrinks()
            ]);

        }

        catch(error){

            console.error(
                error
            );

            showToast(
                "Dashboard loading failed"
            );

        }

    }
);

</script>
